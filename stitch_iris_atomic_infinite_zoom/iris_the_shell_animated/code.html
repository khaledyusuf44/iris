<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=JetBrains+Mono:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg); }
            to { transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg); }
        }
        /* Counter-rotation for labels to stay upright */
        @keyframes counter-orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 218, 243, 0.15); }
            50% { box-shadow: 0 0 40px rgba(0, 218, 243, 0.35); }
        }
        .electron-orbit {
            animation: orbit var(--orbit-speed) linear infinite;
        }
        .label-counter-rotate {
            animation: counter-orbit var(--orbit-speed) linear infinite;
        }
        .bg-void {
            background: radial-gradient(circle at center, #1b1b23 0%, #13131b 100%);
        }
        .luminous-border {
            border: 0.5px solid rgba(180, 203, 206, 0.2);
        }
        .glow-pulse {
            animation: pulse-glow 8s ease-in-out infinite;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#34343d",
                        "on-primary": "#00363d",
                        "tertiary": "#ffeac0",
                        "primary-fixed-dim": "#00daf3",
                        "surface-container-highest": "#34343d",
                        "on-secondary": "#1f3436",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "on-secondary-fixed": "#091f21",
                        "on-primary-fixed-variant": "#004f58",
                        "surface-dim": "#13131b",
                        "surface-container-high": "#292932",
                        "inverse-on-surface": "#303038",
                        "on-error-container": "#ffdad6",
                        "background": "#13131b",
                        "on-tertiary": "#3e2e00",
                        "outline": "#849396",
                        "primary": "#c3f5ff",
                        "surface-bright": "#393841",
                        "outline-variant": "#3b494c",
                        "on-surface-variant": "#bac9cc",
                        "on-surface": "#e4e1ed",
                        "secondary": "#b4cbce",
                        "surface-container": "#1f1f27",
                        "on-primary-container": "#00626e",
                        "on-tertiary-container": "#6f5500",
                        "tertiary-fixed-dim": "#f3bf26",
                        "on-background": "#e4e1ed",
                        "on-primary-fixed": "#001f24",
                        "on-tertiary-fixed-variant": "#594400",
                        "tertiary-container": "#fec931",
                        "on-secondary-container": "#a6bcbf",
                        "inverse-surface": "#e4e1ed",
                        "primary-fixed": "#9cf0ff",
                        "on-secondary-fixed-variant": "#364a4d",
                        "on-tertiary-fixed": "#251a00",
                        "surface-container-low": "#1b1b23",
                        "tertiary-fixed": "#ffdf96",
                        "on-error": "#690005",
                        "inverse-primary": "#006875",
                        "secondary-container": "#384d4f",
                        "primary-container": "#00e5ff",
                        "surface-container-lowest": "#0d0d15",
                        "surface-tint": "#00daf3",
                        "surface": "#13131b",
                        "secondary-fixed-dim": "#b4cbce",
                        "secondary-fixed": "#d0e7ea"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "orbit-md": "32px",
                        "orbit-sm": "16px",
                        "orbit-xl": "128px",
                        "margin": "40px",
                        "orbit-lg": "64px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-xl": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-xs": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "1.5", "letterSpacing": "0.08em", "fontWeight": "500"}],
                        "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "300"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "400"}],
                        "label-xs": ["10px", {"lineHeight": "1.4", "letterSpacing": "0.1em", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden bg-void min-h-screen">
<!-- Top Navigation -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin py-orbit-sm backdrop-blur-xl bg-surface/5 shadow-[0_0_20px_rgba(0,218,243,0.15)]">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">blur_on</span>
<span class="font-headline-xl text-headline-xl tracking-tighter text-primary-fixed-dim">IRIS</span>
</div>
<div class="flex items-center gap-orbit-md">
<button class="material-symbols-outlined text-outline hover:text-primary-fixed-dim transition-colors duration-500">account_circle</button>
</div>
</header>
<!-- Main Canvas -->
<main class="relative flex items-center justify-center w-full h-screen">
<!-- Background Concentric Rings (Receding depth) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="absolute w-[300px] h-[300px] rounded-full border border-outline/10 scale-[1]"></div>
<div class="absolute w-[500px] h-[500px] rounded-full border border-outline/5 scale-[1.2]"></div>
<div class="absolute w-[800px] h-[800px] rounded-full border border-outline/[0.02] scale-[1.5]"></div>
</div>
<!-- Central Nucleus -->
<div class="relative flex items-center justify-center">
<!-- Nucleus Core -->
<div class="z-20 w-32 h-32 rounded-full border luminous-border bg-surface/10 backdrop-blur-3xl flex items-center justify-center glow-pulse transition-all duration-1000">
<div class="w-2 h-2 rounded-full bg-primary-fixed-dim animate-pulse"></div>
</div>
<!-- Electron Orbits & Atoms -->
<!-- Electron 1: Core Pressure -->
<div class="absolute electron-orbit flex items-center" style="--orbit-radius: 120px; --orbit-speed: 35s;">
<div class="flex items-center gap-2 label-counter-rotate" style="--orbit-speed: 35s;">
<div class="w-3 h-3 rounded-full bg-primary-fixed-dim/40 border border-primary luminous-border"></div>
<span class="font-label-sm text-label-sm text-primary opacity-80 whitespace-nowrap">CORE PRESSURE</span>
</div>
</div>
<!-- Electron 2: Angle A -->
<div class="absolute electron-orbit flex items-center" style="--orbit-radius: 160px; --orbit-speed: 45s; animation-delay: -5s;">
<div class="flex items-center gap-2 flex-row-reverse label-counter-rotate" style="--orbit-speed: 45s; animation-delay: -5s;">
<div class="w-2 h-2 rounded-full bg-secondary/30 border border-secondary luminous-border"></div>
<span class="font-label-sm text-label-sm text-secondary opacity-60 whitespace-nowrap">ANGLE A</span>
</div>
</div>
<!-- Electron 3: Velocity -->
<div class="absolute electron-orbit flex items-center" style="--orbit-radius: 200px; --orbit-speed: 25s; animation-delay: -10s;">
<div class="flex items-center gap-2 label-counter-rotate" style="--orbit-speed: 25s; animation-delay: -10s;">
<div class="w-4 h-4 rounded-full bg-primary-fixed-dim/20 border border-primary/40 luminous-border flex items-center justify-center">
<div class="w-1 h-1 rounded-full bg-primary"></div>
</div>
<span class="font-label-sm text-label-sm text-primary-fixed-dim opacity-70 whitespace-nowrap">VELOCITY_02</span>
</div>
</div>
<!-- Electron 4: Flux -->
<div class="absolute electron-orbit flex items-center" style="--orbit-radius: 140px; --orbit-speed: 60s; animation-delay: -15s;">
<div class="flex flex-col items-center label-counter-rotate" style="--orbit-speed: 60s; animation-delay: -15s;">
<div class="w-2 h-2 rounded-full bg-outline/20 border border-outline/40"></div>
<span class="font-label-xs text-label-xs text-outline mt-1 uppercase tracking-widest">FLUX</span>
</div>
</div>
<!-- Particles / Stardust -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] pointer-events-none">
<div class="absolute top-10 left-1/4 w-0.5 h-0.5 bg-primary-fixed-dim/40"></div>
<div class="absolute bottom-20 right-1/3 w-0.5 h-0.5 bg-primary/20"></div>
<div class="absolute top-1/2 right-10 w-0.5 h-0.5 bg-secondary/30"></div>
<div class="absolute bottom-1/4 left-10 w-0.5 h-0.5 bg-primary-fixed-dim/30"></div>
</div>
</div>
<!-- Floating Data Display -->
<div class="absolute bottom-orbit-xl left-margin flex flex-col gap-2 max-w-xs opacity-60">
<div class="h-px w-12 bg-primary-fixed-dim/40 mb-2"></div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-tighter">System State: Active</p>
<p class="font-label-sm text-label-sm text-outline">Shell layer initialized. Sub-atomic clusters detected in sector 4-G.</p>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-center space-x-orbit-lg items-center px-margin pb-orbit-sm">
<a class="flex flex-col items-center justify-center text-outline opacity-40 hover:opacity-100 hover:scale-110 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-icon="adjust">adjust</span>
</a>
<a class="flex flex-col items-center justify-center text-primary-fixed-dim drop-shadow-[0_0_8px_rgba(0,218,243,0.8)] hover:opacity-100 hover:scale-110 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-icon="Grain">grain</span>
</a>
<a class="flex flex-col items-center justify-center text-outline opacity-40 hover:opacity-100 hover:scale-110 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-icon="Hub">hub</span>
</a>
<a class="flex flex-col items-center justify-center text-outline opacity-40 hover:opacity-100 hover:scale-110 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-icon="Settings">settings</span>
</a>
</nav>
<script>
    // Micro-interactions for interactive floating effect
    document.addEventListener('mousemove', (e) => {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const moveX = (e.clientX - centerX) / 50;
        const moveY = (e.clientY - centerY) / 50;
        
        const nucleus = document.querySelector('.z-20');
        if(nucleus) {
            nucleus.style.transform = `translate(${moveX}px, ${moveY}px)`;
        }
    });

    // Initialize Material Symbols
    const symbols = document.querySelectorAll('.material-symbols-outlined');
    symbols.forEach(symbol => {
        if(symbol.dataset.icon) {
            symbol.textContent = symbol.dataset.icon;
        }
    });
</script>
</body></html>
