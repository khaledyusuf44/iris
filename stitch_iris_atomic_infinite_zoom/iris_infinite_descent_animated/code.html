<style>
        body {
            background-color: #050508;
            overflow: hidden;
            perspective: 2000px;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .nucleus-glow {
            box-shadow: 0 0 40px rgba(0, 218, 243, 0.4);
        }
        .orbital-ring {
            border: 1px solid rgba(180, 203, 206, 0.1);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: all 800ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .electron {
            animation: orbit-rotate linear infinite;
        }
        @keyframes orbit-rotate {
            from { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg); }
            to { transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg); }
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00daf3;
            border-radius: 50%;
            opacity: 0.3;
        }
        /* Zoom Transition Classes */
        .zoom-container {
            transition: transform 800ms cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
        }
        .zooming-out {
            transform: scale(4);
            opacity: 0;
        }
        .ring-expanding {
            transform: translate(-50%, -50%) scale(2.5);
            opacity: 0;
        }
        .breadcrumb-ring {
            border: 2px dashed rgba(0, 218, 243, 0.15);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            transition: all 800ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .breadcrumb-active {
            transform: translate(-50%, -50%) scale(1.8);
            opacity: 0.4;
        }
    </style>
</head>
<body class="text-on-background font-body-md text-body-md min-h-screen flex flex-col">
<!-- Particles Background -->
<div class="fixed inset-0 pointer-events-none z-0" id="particle-container"></div>
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full backdrop-blur-xl bg-surface/5 shadow-[0_0_20px_rgba(0,218,243,0.15)] flex justify-between items-center px-margin py-orbit-sm z-50">
<div class="flex items-center space-x-orbit-sm">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">blur_on</span>
<span class="font-headline-xl text-headline-xl tracking-tighter text-primary-fixed-dim">IRIS</span>
</div>
<div class="flex flex-col items-center">
<span class="font-label-xs text-label-xs text-primary-fixed-dim uppercase tracking-widest">Descent Protocol</span>
<div class="flex items-center space-x-2 mt-1">
<div class="h-1 w-4 bg-outline-variant rounded-full"></div>
<div class="h-1 w-4 bg-outline-variant rounded-full"></div>
<div class="h-1 w-8 bg-primary-fixed-dim rounded-full shadow-[0_0_8px_#00daf3]"></div>
</div>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-outline hover:text-primary-fixed-dim transition-colors duration-500 cursor-pointer">account_circle</span>
</div>
</header>
<!-- Main Spatial Canvas -->
<main class="relative flex-grow flex items-center justify-center overflow-hidden">
<!-- Zoom Wrapper -->
<div class="zoom-container relative w-full h-full flex items-center justify-center" id="zoom-viewport">
<!-- Receding Breadcrumbs (Background) -->
<div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center" id="ring-container">
<div class="orbital-ring w-[1200px] h-[1200px] opacity-10"></div>
<div class="orbital-ring w-[800px] h-[800px] opacity-20"></div>
<!-- Breadcrumb ring will be added here via JS -->
</div>
<!-- Level Indicator -->
<div class="absolute top-margin left-1/2 -translate-x-1/2 z-40 text-center pointer-events-none">
<div class="font-label-sm text-label-sm text-outline mb-2 opacity-60">CURRENT DEPTH</div>
<div class="font-headline-lg text-headline-lg text-primary-fixed-dim tracking-widest transition-all duration-500" id="level-text">LEVEL 3</div>
</div>
<!-- Central Nucleus Group -->
<div class="relative z-30 transition-all duration-1000 transform scale-75 lg:scale-100" id="central-system">
<!-- Core Nucleus -->
<div class="w-24 h-24 rounded-full border border-primary-fixed-dim/30 backdrop-blur-xl bg-surface/5 nucleus-glow flex items-center justify-center relative overflow-hidden group transition-all duration-700" id="main-nucleus">
<div class="absolute inset-0 bg-gradient-to-tr from-primary-fixed-dim/20 to-transparent"></div>
<span class="material-symbols-outlined text-primary-fixed-dim text-4xl" style="font-variation-settings: 'FILL' 1;">hub</span>
</div>
<!-- Internal Electrons -->
<div class="electron absolute -top-16 -left-16" style="--orbit-radius: 140px; animation-duration: 15s;">
<div class="bg-surface-container-low border border-outline-variant/30 px-3 py-1.5 rounded-full flex items-center space-x-2 backdrop-blur-md cursor-pointer hover:bg-surface-container transition-colors" onclick="triggerZoom('ALPHA')">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="font-label-xs text-label-xs text-on-surface-variant">NODE_ALPHA</span>
</div>
</div>
<div class="electron absolute -top-16 -left-16" style="--orbit-radius: 240px; animation-duration: 35s; animation-delay: -12s;">
<div class="relative group cursor-pointer" onclick="triggerZoom('RECURSION')">
<div class="absolute -inset-4 bg-primary-fixed-dim/10 blur-xl rounded-full opacity-50 group-hover:opacity-100 transition-opacity"></div>
<div class="bg-surface-container-highest border border-primary-fixed-dim/50 px-4 py-2 rounded-full flex items-center space-x-3 backdrop-blur-xl relative">
<span class="material-symbols-outlined text-primary-fixed-dim text-sm" style="font-variation-settings: 'FILL' 1;">arrow_downward</span>
<span class="font-label-sm text-label-sm text-primary-fixed-dim font-bold">DEEP_RECURSION</span>
<span class="w-2 h-2 rounded-full bg-primary-fixed-dim animate-pulse"></span>
</div>
<div class="absolute top-full left-1/2 -translate-x-1/2 w-[1px] h-20 bg-gradient-to-b from-primary-fixed-dim to-transparent mt-2"></div>
</div>
</div>
</div>
</div>
<!-- Floating Info Cards -->
<div class="absolute bottom-margin left-margin z-40 max-w-xs space-y-gutter pointer-events-none">
<div class="backdrop-blur-xl bg-surface/5 border-[0.5px] border-secondary/20 p-orbit-sm rounded-lg">
<h3 class="font-label-sm text-label-sm text-outline mb-2">SYSTEM_LOG</h3>
<p class="font-body-md text-on-surface-variant text-sm leading-relaxed transition-opacity duration-300" id="log-content">
                    Analyzing sub-atomic structures. Level 3 stability verified at 99.98%. Ready for deeper recursion.
                </p>
</div>
</div>
<div class="absolute top-orbit-xl right-margin z-40 max-w-[200px] text-right pointer-events-none">
<div class="space-y-4">
<div class="flex flex-col items-end">
<span class="font-label-xs text-label-xs text-outline mb-1">DENSITY</span>
<span class="font-label-sm text-label-sm text-primary-fixed-dim">1.284 MG/S</span>
</div>
<div class="flex flex-col items-end">
<span class="font-label-xs text-label-xs text-outline mb-1">PROXIMITY</span>
<span class="font-label-sm text-label-sm text-primary-fixed-dim" id="proximity-val">DEPTH_CRIT_3</span>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-center space-x-orbit-lg items-center px-margin pb-orbit-sm bg-transparent">
<div class="flex space-x-orbit-lg bg-surface/10 backdrop-blur-xl px-8 py-4 rounded-full border border-outline-variant/10">
<button class="flex flex-col items-center justify-center text-outline opacity-40 hover:opacity-100 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined">adjust</span>
</button>
<button class="flex flex-col items-center justify-center text-primary-fixed-dim drop-shadow-[0_0_8px_rgba(0,218,243,0.8)] hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined">grain</span>
</button>
<button class="flex flex-col items-center justify-center text-outline opacity-40 hover:opacity-100 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined">hub</span>
</button>

<!-- Visual Polish: Vignette -->
<div class="fixed inset-0 pointer-events-none z-20 bg-[radial-gradient(circle_at_center,transparent_0%,rgba(5,5,8,0.8)_100%)]"></div>
<script>
        // Particle Generation
        const particleContainer = document.getElementById('particle-container');
        const particleCount = 60;
        for (let i = 0; i < particleCount; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 2 + 1;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.top = `${Math.random() * 100}vh`;
            p.style.opacity = Math.random() * 0.5;
            p.animate([
                { transform: 'translate(0, 0)' },
                { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px)` }
            ], {
                duration: Math.random() * 10000 + 10000,
                iterations: Infinity,
                direction: 'alternate',
                easing: 'ease-in-out'
            });
            particleContainer.appendChild(p);
        }

        // Infinite Zoom Logic
        let currentLevel = 3;
        const viewport = document.getElementById('zoom-viewport');
        const ringContainer = document.getElementById('ring-container');
        const levelText = document.getElementById('level-text');
        const logContent = document.getElementById('log-content');
        const proximityVal = document.getElementById('proximity-val');

        function triggerZoom(nodeName) {
            // 1. Mark rings as expanding and fading
            const existingRings = ringContainer.querySelectorAll('.orbital-ring');
            existingRings.forEach(ring => {
                ring.classList.add('ring-expanding');
            });

            // 2. Add breadcrumb ring representing the layer we're leaving
            const breadcrumb = document.createElement('div');
            breadcrumb.className = 'breadcrumb-ring';
            ringContainer.appendChild(breadcrumb);
            // Trigger animation in next frame
            requestAnimationFrame(() => {
                breadcrumb.classList.add('breadcrumb-active');
            });

            // 3. Rapid scale up of the whole view
            viewport.classList.add('zooming-out');

            // 4. Reset and update UI after fly-in effect
            setTimeout(() => {
                currentLevel++;
                
                // Update UI text
                levelText.innerText = `LEVEL ${currentLevel}`;
                logContent.style.opacity = '0';
                setTimeout(() => {
                    logContent.innerText = `Establishing connection to sub-node ${nodeName}. Integrity check: PASSED. Depth synchronization at ${99 + Math.random().toFixed(2)}%.`;
                    logContent.style.opacity = '1';
                }, 300);
                proximityVal.innerText = `DEPTH_CRIT_${currentLevel}`;

                // Remove old rings and breadcrumb to clean up DOM
                existingRings.forEach(r => r.remove());
                
                // Reset viewport for the next level
                viewport.style.transition = 'none';
                viewport.classList.remove('zooming-out');
                
                // Re-create some background rings for the new level
                const r1 = document.createElement('div');
                r1.className = 'orbital-ring w-[1200px] h-[1200px] opacity-10';
                const r2 = document.createElement('div');
                r2.className = 'orbital-ring w-[800px] h-[800px] opacity-20';
                ringContainer.appendChild(r1);
                ringContainer.appendChild(r2);

                // Force reflow and re-enable transition
                viewport.offsetHeight;
                viewport.style.transition = '';
            }, 800);
        }

        // Mouse Parallax
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 15;
            const y = (e.clientY / window.innerHeight - 0.5) * 15;
            const canvas = document.getElementById('central-system');
            if (canvas && !viewport.classList.contains('zooming-out')) {
                canvas.style.transform = `scale(0.85) translate(${x}px, ${y}px)`;
            }
        });
    </script>
</body></html>
